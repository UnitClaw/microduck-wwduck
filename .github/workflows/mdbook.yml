name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "book-en/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.44"

      - name: Build Chinese book
        run: mdbook build book

      - name: Build English book
        run: mdbook build book-en

      - name: Assemble bilingual site
        run: |
          mkdir -p site
          cp -r book/book/* site/
          mkdir -p site/en
          cp -r book-en/book/* site/en/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
